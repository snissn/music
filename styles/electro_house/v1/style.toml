schema = "songdna-style/v1"
id = "electro_house/v1"
name = "Electro House"

[defaults]
ticks_per_beat = 480
meter_numerator = 4
meter_denominator = 4
velocity_jitter = 3

[roles.kick]
generator = "fixed_note"
channel = 9
note = 36
offsets = [0.0, 1.0, 2.0, 3.0]
duration = 0.20
velocity = 118

[roles.clap]
generator = "fixed_note"
channel = 9
note = 39
offsets = [1.0, 3.0]
duration = 0.18
velocity = 108

[roles.closed_hat]
generator = "fixed_note"
channel = 9
note = 42
offsets = [0.5, 1.5, 2.5, 3.5]
duration = 0.12
velocity = 91

[roles.open_hat]
generator = "fixed_note"
channel = 9
note = 46
offsets = [0.5, 2.5]
duration = 0.30
velocity = 93
min_energy = 0.55

[roles.percussion]
generator = "fixed_note"
channel = 9
note = 37
offsets = [0.75, 2.75, 3.5]
duration = 0.10
velocity = 82
min_energy = 0.70

[roles.bass]
generator = "chord_pulse"
channel = 0
octave = 2
offsets = [0.5, 1.5, 2.5, 3.5]
duration = 0.42
velocity = 112

[roles.harmony]
generator = "chord"
channel = 1
octave = 4
voices = 3
offsets = [0.0, 0.75, 1.5, 2.5, 3.25]
duration = 0.32
velocity = 91

[roles.lead]
generator = "motif"
channel = 2
octave = 5
gate = 0.82
velocity = 105

[roles.fx_trigger]
generator = "fixed_note"
channel = 3
note = 84
offsets = [0.0]
duration = 0.25
velocity = 78

[sections.intro]
roles = ["kick", "closed_hat", "harmony", "fx_trigger"]

[sections.build]
roles = ["kick", "clap", "closed_hat", "bass", "harmony", "lead", "fx_trigger"]

[sections.drop]
roles = ["kick", "clap", "closed_hat", "open_hat", "percussion", "bass", "harmony", "lead", "fx_trigger"]

[sections.breakdown]
roles = ["harmony", "lead", "fx_trigger"]

[sections.outro]
roles = ["kick", "closed_hat", "bass", "harmony"]

