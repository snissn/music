schema = "songdna-production/v2"
song = "neon_tides"

[session]
daw = "Ardour"
sample_rate = 48000
bit_depth = 24

[mastering]
version = "songdna-mastering/v1"
sample_rate = 48000
bit_depth = 24
channels = 2
target_lufs = -14.0
lufs_tolerance = 1.0
true_peak_dbtp = -1.0
fade_frames = 2400
dither = "none" # 24-bit pre-master remains 24-bit PCM; no word-length reduction.
codec = "mp3/lame-cbr"
mp3_bitrate_kbps = 320

[role_map.kick]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized kick"
[role_map.clap]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized clap"
[role_map.closed_hat]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized closed hat"
[role_map.open_hat]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized open hat"
[role_map.percussion]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized percussion"
[role_map.bass]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized bass"
[role_map.harmony]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized chord layer"
[role_map.lead]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized lead"
[role_map.fx_trigger]
origin = "original_synthesis"
owner = "project_author"
description = "original synthesized transition effects"

[graph]
version = "production-graph/v1"
master_bus = "pre_master"
[[graph.buses]]
id = "music"
[[graph.buses]]
id = "pre_master"
[[graph.nodes]]
id = "kick_route"
type = "gain_pan"
version = "v1"
source = "role:kick"
destination = "bus:music"
gain = 0.92
pan = 0.0
[[graph.nodes]]
id = "clap_route"
type = "gain_pan"
version = "v1"
source = "role:clap"
destination = "bus:music"
gain = 0.68
pan = 0.0
[[graph.nodes]]
id = "hats_route"
type = "gain_pan"
version = "v1"
source = "role:closed_hat"
destination = "bus:music"
gain = 0.50
pan = 0.0
[[graph.nodes]]
id = "open_hats_route"
type = "gain_pan"
version = "v1"
source = "role:open_hat"
destination = "bus:music"
gain = 0.48
pan = 0.0
[[graph.nodes]]
id = "percussion_route"
type = "gain_pan"
version = "v1"
source = "role:percussion"
destination = "bus:music"
gain = 0.52
pan = 0.0
[[graph.nodes]]
id = "bass_duck"
type = "sidechain_duck"
version = "v1"
source = "role:bass"
key = "role:kick"
destination = "bus:music"
amount = 0.36
release_frames = 6400
[[graph.nodes]]
id = "harmony_route"
type = "gain_pan"
version = "v1"
source = "role:harmony"
destination = "bus:music"
gain = 0.57
pan = 0.0
[[graph.nodes]]
id = "lead_route"
type = "gain_pan"
version = "v1"
source = "role:lead"
destination = "bus:music"
gain = 0.67
pan = 0.0
[[graph.nodes]]
id = "fx_delay"
type = "reverb_send"
version = "v1"
source = "role:fx_trigger"
destination = "bus:music"
wet = 0.22
delay_frames = 3600
[[graph.nodes]]
id = "section_filter"
type = "one_pole_lowpass"
version = "v1"
source = "bus:music"
destination = "bus:pre_master"
cutoff = 0.30
automation = [{ start_frame = 3600000, end_frame = 5040000, parameter = "cutoff", start = 0.14, end = 0.82 }]
