name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: songdna validate songs/circuit_bloom/song.toml
      - run: songdna inspect songs/neon_tides/song.toml
      - run: songdna compile songs/circuit_bloom/song.toml
      - run: songdna compile songs/neon_tides/song.toml
      - run: songdna validate songs/glass_transit/song.toml
      - run: songdna inspect songs/glass_transit/song.toml
      - run: songdna compile songs/glass_transit/song.toml
      - run: python benchmarks/compile_v2.py
      - run: python -m unittest tests.test_cli_integration -v

  ardour-handoff-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: songdna handoff songs/circuit_bloom/song.toml
      - run: songdna handoff-validate generated/circuit_bloom/ardour-handoff
      - run: ./scripts/ardour_smoke.sh generated/circuit_bloom/ardour-handoff circuit_bloom

  qualify-reference-songs:
    # One canonical lane exercises compile, render, master, repeat hashes, and
    # the Circuit Bloom handoff bundle for all three originals.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: brew install ffmpeg lame
      - run: ffmpeg -version | head -1 | grep 'ffmpeg version 8.1.2'
      - run: ffprobe -version | head -1 | grep 'ffprobe version 8.1.2'
      - run: lame --version | grep 'version 3.100'
      - run: python -m pip install .
      - run: songdna qualify --automated-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: songdna-qualification-listening
          # Keep every ledger-referenced file. A reviewer can download this
          # directory into an exact-head checkout, edit the worksheet, and run
          # the full validator after the ephemeral CI workspace is gone.
          path: generated/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
