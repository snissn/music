name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: songdna validate songs/circuit_bloom/song.toml
      - run: songdna inspect songs/neon_tides/song.toml
      - run: songdna compile songs/circuit_bloom/song.toml
      - run: songdna compile songs/neon_tides/song.toml
      - run: python -m unittest tests.test_cli_integration -v

  render-reference-songs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: songdna render songs/circuit_bloom/song.toml
      - run: songdna render songs/neon_tides/song.toml

  master-reference-songs:
    # The canonical delivery lane is exercised, not mocked or skipped.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: brew install ffmpeg lame
      - run: ffmpeg -version | head -1 | grep 'ffmpeg version 8.1.2'
      - run: ffprobe -version | head -1 | grep 'ffprobe version 8.1.2'
      - run: lame --version | grep 'version 3.100'
      - run: python -m pip install .
      - run: songdna render songs/circuit_bloom/song.toml
      - run: songdna master songs/circuit_bloom/song.toml
      - run: songdna render songs/neon_tides/song.toml
      - run: songdna master songs/neon_tides/song.toml
