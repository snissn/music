name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: songdna validate songs/circuit_bloom/song.toml
      - run: songdna inspect songs/neon_tides/song.toml
      - run: songdna compile songs/circuit_bloom/song.toml
      - run: songdna compile songs/neon_tides/song.toml
      - run: python -m unittest tests.test_cli_integration -v
